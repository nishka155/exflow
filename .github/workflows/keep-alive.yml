name: Keep backend warm

# Render's free tier spins the backend down after ~15 minutes idle, and the
# next real request then eats a 30-50s cold start — this is the single
# biggest source of "the site is slow" in practice. Pinging the health
# endpoint every 10 minutes keeps it from ever going idle long enough to
# spin down, at no cost (GitHub Actions free tier, no paid Render plan
# needed).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl -fsS --max-time 60 https://exflow-backend-3xb2.onrender.com/health
